version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ratehub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ratehub_user
      POSTGRES_PASSWORD: ratehub_password_secure_123
      POSTGRES_DB: ratehub_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ratehub_user -d ratehub_db']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: ratehub_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: 'postgresql://database_6ap1_user:s37cPReYoRCwPR4QxTwi9px458gvRya4@dpg-dac2dm67bikc73emolng-a.oregon-postgres.render.com/database_6ap1?sslmode=require'
      JWT_ACCESS_SECRET: 'ratehub_jwt_access_secret_production_ready_key_982341'
      JWT_ACCESS_EXPIRY: '15m'
      JWT_REFRESH_SECRET: 'ratehub_jwt_refresh_secret_production_ready_key_109283'
      JWT_REFRESH_EXPIRY: '7d'
      BCRYPT_OR_ARGON2_COST: 4
      CORS_ORIGIN: 'http://localhost:5173'
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
      LOGIN_RATE_LIMIT_MAX: 5
      SEED_ADMIN_EMAIL: 'admin@storerating.com'
      SEED_ADMIN_PASSWORD: 'AdminPassword123!'
    ports:
      - '3000:3000'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/api/node_modules
      - /usr/src/app/packages/shared/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: ratehub_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: 'http://localhost:3000/api/v1'
    ports:
      - '5173:5173'
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/web/node_modules

volumes:
  postgres_data:
